name: Bazel Remote Build (BuildBuddy)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# all Bazel + BuildBuddy env vars consolidated here
env:
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

jobs:
  test:
    name: build + test (remote cache + RBE)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: bazelbuild/setup-bazelisk@v2
        with:
          bazelisk-cache: true

      # BES backend + API key are baked into the .bazelrc at the
      # config:ci-remote level. We still pass the API key via
      # --remote_header so the local daemon auths against BuildBuddy
      # even before any config is read.
      - name: Build (remote cache only)
        working-directory: rust-port
        run: |
          bazel --version
          bazel build //...

      - name: Test (remote cache + RBE executor)
        working-directory: rust-port
        run: |
          bazel test //...:all \
            --config=ci-remote \
            --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY} \
            --remote_header=x-buildbuddy-platform=github-actions \
            --remote_header=x-buildbuddy-label=${GITHUB_RUN_ID}

      - name: Upload Bazel test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs
          path: |
            rust-port/bazel-testlogs/**
            rust-port/bazel-bin/**/*.log
          if-no-files-found: ignore

      - name: Summary link
        if: always()
        run: |
          echo "🔗 BuildBuddy invocation: https://app.buildbuddy.io/invocation/?bes_backend=grpcs://cloud.buildbuddy.io&search=${GITHUB_RUN_ID}"
